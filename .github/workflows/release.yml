name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: grocery-linux-x86_64.tar.gz
            bin_name: grocery
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: grocery-windows-x86_64.zip
            bin_name: grocery.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: grocery-macos-x86_64.tar.gz
            bin_name: grocery
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: grocery-macos-aarch64.tar.gz
            bin_name: grocery
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Release Binary
        run: cargo build -p groshe-cli --release --target ${{ matrix.target }}

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin_name }} -DestinationPath ${{ matrix.asset_name }}
          Get-FileHash ${{ matrix.asset_name }} -Algorithm SHA256 | Out-File "${{ matrix.asset_name }}.sha256"

      - name: Package Unix Artifact
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.asset_name }} -C target/${{ matrix.target }}/release ${{ matrix.bin_name }}
          shasum -a 256 ${{ matrix.asset_name }} > "${{ matrix.asset_name }}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
