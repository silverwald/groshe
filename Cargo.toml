[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/sync",
    "crates/store",
    "crates/cli",
    "apps/android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Groshe Contributors"]
repository = "https://github.com/groshe/groshe"

[workspace.dependencies]
# First-party workspace crates
groshe-core = { path = "crates/core" }
groshe-sync = { path = "crates/sync" }
groshe-store = { path = "crates/store" }

# Common utilities & serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
thiserror = "2.0"
uuid = { version = "1.10", default-features = false, features = ["v7", "serde", "std", "rng"] }

# Async runtime & logging
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Slint UI (winit + femtovg backend, excluding linuxkms)
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg"] }
slint-build = "1.18"

# Testing
proptest = "1.5"
qrcode = { version = "0.14", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true