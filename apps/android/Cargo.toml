[package]
name = "groshe-android"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Android mobile app entry point and Slint UI prototype for Groshe"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "groshe-mobile-preview"
path = "src/main.rs"

[dependencies]
groshe-core = { workspace = true }
groshe-sync = { workspace = true }
groshe-store = { workspace = true }
futures-util = "0.3"
tokio = { workspace = true }
tracing.workspace = true
uuid = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18", "backend-android-activity-06", "renderer-femtovg"] }
android-activity = { version = "0.6", default-features = false }
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
