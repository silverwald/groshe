[package]
name = "groshe-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Iroh Endpoint, iroh-docs synchronization, and ticket management for Groshe"

[dependencies]
groshe-core = { workspace = true }
serde = { workspace = true, features = ["alloc"] }
thiserror.workspace = true
anyhow = "1.0"
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait = "0.1"
iroh = "1.3"
iroh-blobs = "0.103"
iroh-gossip = "0.101"
iroh-docs = { version = "0.101", features = ["fs-store"] }
futures-util = "0.3"
tokio-stream = "0.1"
qrcode = { workspace = true }
toml = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = "3.0"

[dev-dependencies]
groshe-store = { workspace = true }
groshe-web = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
http-body-util = "0.1"
tokio-tungstenite = "0.24"
tower = { version = "0.4", features = ["util"] }
rand = "0.10"
tempfile = "3.17"
